services:
  - type: web
    name: foodverse-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # Set this manually in the Render dashboard — never commit the real key
    healthCheckPath: /api/health
    autoDeploy: true
